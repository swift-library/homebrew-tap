name: Verify tap
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
            swift: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
        with:
          token: ${{ github.token }}
      - uses: swift-library/github-workflows/actions/select-toolchain@5dd95c4ee515c667abaea2dc5426e8ef93e88784
        with:
          xcode: ${{ matrix.xcode }}
          swift: ${{ matrix.swift }}
      - name: Validate updater
        run: |
          set -euo pipefail
          swift test --force-resolved-versions
          python3 -B -m unittest discover -s Tests/Automation
          xcrun swift-format lint --strict --configuration .swift-format --recursive Package.swift Sources Tests
      - name: Verify release identities and formula style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          swift run --force-resolved-versions tap-updater verify .
          brew style swift-library/tap
      - name: Verify swift-sh installation
        if: hashFiles('Formula/swift-sh.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-sh
          brew audit --strict --online swift-library/tap/swift-sh
          brew install --build-from-source swift-library/tap/swift-sh
          brew test swift-library/tap/swift-sh
      - name: Verify Interface Distiller installation
        if: hashFiles('Formula/swift-interface-distiller.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-interface-distiller
          brew audit --strict --online swift-library/tap/swift-interface-distiller
          brew install --build-from-source swift-library/tap/swift-interface-distiller
          brew test swift-library/tap/swift-interface-distiller
      - name: Verify App Store Connect installation
        if: hashFiles('Formula/swift-appstoreconnect.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-appstoreconnect
          brew audit --strict --online swift-library/tap/swift-appstoreconnect
          brew install --build-from-source swift-library/tap/swift-appstoreconnect
          brew test swift-library/tap/swift-appstoreconnect

  result:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete tap validation
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$VERIFY_RESULT" = success
