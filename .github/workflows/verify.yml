name: Verify tap
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '26.0.1'
            swift: '6.3.3'
          - runner: macos-26
            xcode: '26.6'
            swift: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ github.token }}
      - run: Scripts/select-toolchain "$XCODE_VERSION" "$SWIFT_VERSION"
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
          SWIFT_VERSION: ${{ matrix.swift }}
      - name: Validate updater
        run: |
          set -euo pipefail
          mkdir -p .build/evidence
          swift test --force-resolved-versions 2>&1 | tee .build/evidence/swift-test.log
          python3 -B -m unittest discover -s Tests/Automation 2>&1 | tee .build/evidence/notice-tests.log
          xcrun swift-format lint --strict --configuration .swift-format --recursive Package.swift Sources Tests
      - name: Verify release identities and formula style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          swift run --force-resolved-versions tap-updater verify .
          brew style swift-library/tap
      - name: Verify swift-sh installation
        if: hashFiles('Formula/swift-sh.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-sh
          brew audit --strict --online swift-library/tap/swift-sh
          brew install --build-from-source swift-library/tap/swift-sh 2>&1 | tee .build/evidence/source-install.log
          brew test swift-library/tap/swift-sh 2>&1 | tee .build/evidence/runtime.log
      - name: Verify Interface Distiller installation
        if: hashFiles('Formula/swift-interface-distiller.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-interface-distiller
          brew audit --strict --online swift-library/tap/swift-interface-distiller
          brew install --build-from-source swift-library/tap/swift-interface-distiller 2>&1 | tee .build/evidence/interface-distiller-source-install.log
          brew test swift-library/tap/swift-interface-distiller 2>&1 | tee .build/evidence/interface-distiller-runtime.log
      - name: Verify App Store Connect installation
        if: hashFiles('Formula/swift-appstoreconnect.rb') != ''
        run: |
          set -euo pipefail
          brew trust --formula swift-library/tap/swift-appstoreconnect
          brew audit --strict --online swift-library/tap/swift-appstoreconnect
          brew install --build-from-source swift-library/tap/swift-appstoreconnect 2>&1 | tee .build/evidence/appstoreconnect-source-install.log
          brew test swift-library/tap/swift-appstoreconnect 2>&1 | tee .build/evidence/appstoreconnect-runtime.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tap-validation-${{ matrix.runner }}
          path: .build/evidence/
          if-no-files-found: warn

  result:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete tap validation
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$VERIFY_RESULT" = success
