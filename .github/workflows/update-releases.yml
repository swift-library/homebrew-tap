name: Update published releases
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: update-published-releases
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'swift-library/homebrew-tap'
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: Scripts/select-toolchain 26.6
      - run: swift test --force-resolved-versions
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift run --force-resolved-versions tap-updater prepare
      - if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/
          if-no-files-found: error
  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      candidate-artifact: distribution-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: [prepare, verify]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - run: Scripts/select-toolchain 26.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Recheck release and publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          swift run --force-resolved-versions tap-updater verify .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Formula/swift-sh.rb Metadata/swift-sh.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified swift-sh distribution'
          git push origin HEAD:master
