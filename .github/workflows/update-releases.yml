name: Update published releases
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: update-published-releases
  cancel-in-progress: false
jobs:
  detect:
    if: github.repository == 'swift-library/homebrew-tap' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: swift-library/github-workflows/actions/select-toolchain@c73e5121f19dd64e85d3b506dfae95685647d065
        with:
          xcode: '26.6'
          swift: ''
      - run: swift test --force-resolved-versions
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release-notices.py detect
      - if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/
          include-hidden-files: true
          if-no-files-found: error
  notify:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate
      - name: Open release notices
        env:
          GH_TOKEN: ${{ github.token }}
          DETECTION_COMMIT: ${{ needs.detect.outputs.commit }}
        run: python3 -B scripts/release-notices.py notify
