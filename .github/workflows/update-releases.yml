name: Update published releases
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: update-published-releases
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'swift-library/homebrew-tap'
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: Scripts/select-toolchain 26.6
      - run: swift test --force-resolved-versions
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift run --force-resolved-versions tap-updater prepare
      - if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/
          include-hidden-files: true
          if-no-files-found: error
  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      candidate-artifact: distribution-${{ github.run_id }}-${{ github.run_attempt }}
  propose:
    needs: [prepare, verify]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - run: Scripts/select-toolchain 26.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Recheck release and validated base
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          swift run --force-resolved-versions tap-updater verify .
          current_base=$(git ls-remote origin refs/heads/master | cut -f1)
          test "$current_base" = "$VALIDATED_COMMIT"
      - name: Create a repository-scoped Updater App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Check the configured bot identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_LOGIN: ${{ vars.UPDATER_APP_BOT_LOGIN }}
        run: test "$BOT_LOGIN" = "${APP_SLUG}[bot]"
      - name: Propose the verified distribution
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: master
          branch: automation/update-swift-sh
          add-paths: |
            Formula/swift-sh.rb
            Metadata/swift-sh.json
          commit-message: 'chore: update verified swift-sh release'
          title: 'chore: update verified swift-sh release'
          body: |
            Update the formula and release metadata to the selected stable swift-sh release.

            The candidate passed source installation and runtime checks on macOS 15 and 26.
            Its release identity was rechecked before this proposal.
            Required pull-request checks validate the resulting branch before auto-merge.

            Validated base: `${{ needs.prepare.outputs.commit }}`
            Evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Enable auto-merge for the verified proposal
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.proposal.outputs.pull-request-head-sha }}
          BOT_LOGIN: ${{ vars.UPDATER_APP_BOT_LOGIN }}
        run: >-
          python3 Scripts/enable-update-merge.py
          --repository "$GITHUB_REPOSITORY" --number "$PR_NUMBER"
          --head "$PR_HEAD" --bot "$BOT_LOGIN"
